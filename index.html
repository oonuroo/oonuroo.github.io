<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onur Bacaksız — Uygulamalar</title>
<style>
  :root { --bg: #F4F1EB; --ink: #24201C; --soft: #24201C99; --accent: #A8432F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171615; --ink: #EFEAE2; --soft: #EFEAE299; --accent: #D0664F; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 20px; }
  h1 { font: 400 40px/1.1 "Bodoni 72", "Didot", Georgia, serif; margin: 0 0 32px; }
  a { color: var(--accent); text-decoration: none; }
  li { margin-bottom: 10px; list-style: none; }
  ul { padding: 0; }
  span { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Onur Bacaksız</h1>
  <ul>
    <li><a href="mangala/">Mangala</a> <span>— mermer tahtada Türk zekâ oyunu</span></li>
  </ul>
</main>
</body>
</html>
